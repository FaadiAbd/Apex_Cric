<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ApexCric</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Montserrat:wght@300;400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <style type="text/tailwindcss">
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(25,250,170,0.4);}
            70% { box-shadow: 0 0 0 20px rgba(25,250,170,0);}
            100% { box-shadow: 0 0 0 0 rgba(25,250,170,0);}
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse 2s infinite; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: rise 10s infinite linear;
        }
        @keyframes rise {
            from { transform: translateY(100vh) scale(0); opacity: 1; }
            to { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        :root {
            --brand-glow: #19faaa;
            --neon-blue: #0ea8f0;
        }
        .glassmorphic {
            backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(25,250,170,0.2);
            box-shadow: 0 0 20px rgba(25,250,170,0.1);
        }
        .upload-button-glow {
            box-shadow: 0 0 15px 5px rgba(25,250,170,0.3), 0 0 30px 10px rgba(25,250,170,0.1);
        }
        .upload-button-glow:hover {
            box-shadow: 0 0 20px 7px rgba(25,250,170,0.5), 0 0 40px 15px rgba(25,250,170,0.2);
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.2);
            border-left-color: var(--brand-glow);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: auto;
            background-color: #0d1117;
            font-family: 'Montserrat', 'Space Grotesk', sans-serif;
        }
        .screen-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }
        .screen-overlay.overflow-hidden {
            overflow: hidden;
        }
        .screen-overlay.hidden {
            display: none !important;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glassmorphic-analysis {
            background: rgba(22, 29, 39, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .pill-button {
            @apply px-4 py-2 rounded-full text-white font-bold transition-all duration-300 whitespace-nowrap;
            background: rgba(14,168,240,0.2);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(14,168,240,0.4);
        }
        .pill-button:hover {
            background: rgba(14,168,240,0.5);
            box-shadow: 0 0 15px rgba(14,168,240,0.6);
        }
        .pill-button.active {
            background: var(--neon-blue);
            box-shadow: 0 0 15px rgba(14,168,240,0.6);
        }
        .pill-button-secondary {
            background: rgba(25,250,170,0.15);
            border-color: var(--brand-glow);
        }
        .pill-button-secondary:hover {
            background: rgba(25,250,170,0.25);
        }
        .auth-tab {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(156, 163, 175, 1);
        }
        .auth-tab:hover { color: #fff; }
        .auth-tab.active {
            background: rgba(14,168,240,0.2);
            border-color: var(--neon-blue);
            color: #fff;
            box-shadow: 0 0 10px rgba(14,168,240,0.4);
        }
        .auth-tab.active:hover {
            background: rgba(14,168,240,0.5);
            box-shadow: 0 0 15px rgba(14,168,240,0.6);
        }
        .history-sidepanel {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            max-width: 85vw;
            height: 100vh;
            z-index: 40;
            background: rgba(13, 17, 23, 0.98);
            border-right: 1px solid rgba(25,250,170,0.2);
            box-shadow: 4px 0 24px rgba(0,0,0,0.3);
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }
        .history-sidepanel.open {
            transform: translateX(0);
        }
        .history-sidepanel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .history-sidepanel-header h2 { font-size: 1rem; margin: 0; }
        .history-list-container {
            flex: 1;
            overflow-y: auto;
        }
        .history-list {
            list-style: none;
            margin: 0;
            padding: 0.5rem 0;
        }
        .history-list li {
            margin: 0;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: background 0.15s;
        }
        .history-list li:hover {
            background: rgba(25,250,170,0.08);
        }
        .history-list li .history-item-date {
            font-size: 0.75rem;
            color: var(--neon-blue);
            margin-bottom: 0.25rem;
        }
        .history-list li .history-item-label {
            font-size: 0.875rem;
            color: #e5e7eb;
        }
        .history-overlay {
            position: fixed;
            inset: 0;
            z-index: 35;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .history-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px;}
        ::-webkit-scrollbar-thumb:hover { background: #19faaa; }

        .app-sidebar {
            width: 240px;
            min-width: 240px;
            height: 100vh;
            background: rgba(13, 17, 23, 0.98);
            border-right: 1px solid rgba(25,250,170,0.2);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .app-sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .app-sidebar-logo svg { flex-shrink: 0; }
        .app-sidebar-nav {
            flex: 1;
            padding: 1rem 0;
        }
        .app-sidebar-nav a,
        .app-sidebar-nav button {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: none;
            background: transparent;
            color: rgba(226, 232, 240, 0.85);
            font-size: 0.9375rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-align: left;
        }
        .app-sidebar-nav a:hover,
        .app-sidebar-nav button:hover {
            background: rgba(25,250,170,0.08);
            color: #fff;
        }
        .app-sidebar-nav a.active,
        .app-sidebar-nav button.active {
            background: rgba(14,168,240,0.2);
            color: var(--neon-blue);
            border-left: 3px solid var(--neon-blue);
        }
        .app-sidebar-bottom {
            padding: 1rem 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .app-sidebar-user {
            font-size: 0.8125rem;
            color: rgba(226, 232, 240, 0.9);
            margin-bottom: 0.75rem;
            word-break: break-word;
        }
        .app-sidebar-bottom .pill-button {
            width: 100%;
            justify-content: center;
        }
        .app-main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }
        .app-pane { display: none; flex: 1; flex-direction: column; overflow: auto; }
        .app-pane.active { display: flex; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0d0d26] to-[#103c3c] text-white">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
