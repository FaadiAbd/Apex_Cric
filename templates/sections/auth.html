<div id="auth-section" class="screen-overlay hidden">
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1595392490148-d75073809623?q=80&w=2070&auto=format&fit=crop');"></div>
    <div class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm"></div>
    <div class="relative z-10 flex flex-1 items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="glassmorphic p-6 md:p-8">
                <div class="flex rounded-lg bg-white/5 p-1 mb-6 gap-1">
                    <button type="button" id="auth-tab-login" class="auth-tab flex-1 py-2.5 rounded-md font-semibold transition-all duration-200 active">Log in</button>
                    <button type="button" id="auth-tab-signup" class="auth-tab flex-1 py-2.5 rounded-md font-semibold transition-all duration-200">Sign up</button>
                </div>

                <div id="auth-panel-login" class="auth-panel">
                    <h2 class="text-xl orbitron font-bold text-white mb-4">Log in</h2>
                    <form id="login-form" class="space-y-4">
                        <input type="email" name="email" placeholder="Email" required
                            class="w-full px-4 py-3 rounded-lg bg-white/5 border border-gray-500 text-white placeholder-gray-400 focus:border-[var(--brand-glow)] focus:ring-1 focus:ring-[var(--brand-glow)] outline-none"/>
                        <input type="password" name="password" placeholder="Password" required
                            class="w-full px-4 py-3 rounded-lg bg-white/5 border border-gray-500 text-white placeholder-gray-400 focus:border-[var(--brand-glow)] focus:ring-1 focus:ring-[var(--brand-glow)] outline-none"/>
                        <p id="login-error" class="text-red-400 text-sm hidden"></p>
                        <button type="submit" class="w-full py-3 rounded-lg font-bold text-white bg-[var(--neon-blue)] hover:opacity-90 transition-opacity">Log in</button>
                    </form>
                </div>

                <div id="auth-panel-signup" class="auth-panel hidden">
                    <h2 class="text-xl orbitron font-bold text-white mb-4">Sign up</h2>
                    <form id="signup-form" class="space-y-4">
                        <input type="text" name="name" placeholder="Name (optional)"
                            class="w-full px-4 py-3 rounded-lg bg-white/5 border border-gray-500 text-white placeholder-gray-400 focus:border-[var(--brand-glow)] focus:ring-1 focus:ring-[var(--brand-glow)] outline-none"/>
                        <input type="email" name="email" placeholder="Email" required
                            class="w-full px-4 py-3 rounded-lg bg-white/5 border border-gray-500 text-white placeholder-gray-400 focus:border-[var(--brand-glow)] focus:ring-1 focus:ring-[var(--brand-glow)] outline-none"/>
                        <input type="password" name="password" placeholder="Password (min 6 characters)" required minlength="6"
                            class="w-full px-4 py-3 rounded-lg bg-white/5 border border-gray-500 text-white placeholder-gray-400 focus:border-[var(--brand-glow)] focus:ring-1 focus:ring-[var(--brand-glow)] outline-none"/>
                        <p id="signup-error" class="text-red-400 text-sm hidden"></p>
                        <button type="submit" class="w-full py-3 rounded-lg font-bold text-white bg-[var(--brand-glow)] hover:opacity-90 transition-opacity text-black">Sign up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
